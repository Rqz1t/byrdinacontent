<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>byrdinacontent — UGC-кріейторка Анастасія</title>

  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="byrdinacontent — UGC-кріейторка Анастасія">
  <meta property="og:description" content="Автентичні UGC-відео, завдяки яким люди помічають, довіряють і обирають твій бренд.">
  <meta property="og:image" content="https://byrdinacontent.pages.dev/img/og-preview.jpg">
  <meta property="og:url" content="https://byrdinacontent.pages.dev/">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    (() => {
      const supported = new Set(['uk', 'pl', 'en']);
      let saved;
      try { saved = localStorage.getItem('byrdina-language'); } catch (error) {}
      const languages = navigator.languages || [navigator.language || ''];
      const detected = (languages[0] || '').toLowerCase().split('-')[0];
      const language = supported.has(saved) ? saved : (supported.has(detected) ? detected : 'uk');
      location.replace(`./${language}/index.html${location.search}${location.hash}`);
    })();
  </script>
</head>
<body></body>
</html>
