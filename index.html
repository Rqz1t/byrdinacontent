<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>byrdinacontent</title>
  <script>
    (() => {
      const supported = new Set(['uk', 'pl', 'en']);
      let saved;
      try { saved = localStorage.getItem('byrdina-language'); } catch (error) {}
      const languages = navigator.languages || [navigator.language || ''];
      const detected = (languages[0] || '').toLowerCase().split('-')[0];
      const language = supported.has(saved) ? saved : (supported.has(detected) ? detected : 'uk');
      location.replace(`./${language}/index.html${location.search}${location.hash}`);
    })();
  </script>
</head>
<body></body>
</html>
