  <style>
    :root{--paper:#e7e7df;--cream:#f7f8f2;--green:#5d887b;--ink:#2f3937;--blue:#1d3740;--muted:#687675;--line:rgba(29,55,64,.14);--serif:'Cormorant Garamond',Georgia,serif;--sans:Manrope,Arial,sans-serif;--hand:Caveat,cursive}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(55% 40% at 50% 5%,rgba(154,193,182,.42),transparent 72%),var(--paper);font-family:var(--sans);color:var(--ink)}.card{position:relative;overflow:hidden;width:min(580px,100%);padding:clamp(38px,7vw,72px);text-align:center;background:rgba(247,248,242,.86);border:1px solid var(--line);box-shadow:0 22px 55px rgba(28,53,55,.16)}.card:after{content:'35 mm';position:absolute;right:-20px;bottom:-35px;color:rgba(93,136,123,.11);font:600 110px var(--serif);transform:rotate(-8deg)}.back,.eyebrow,.hint{position:relative;z-index:1}.back{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.eyebrow{margin-top:42px;color:var(--green);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase}h1{position:relative;z-index:1;margin:12px 0;font:600 clamp(43px,8vw,68px)/.9 var(--serif);letter-spacing:-.04em;color:var(--blue)}p{position:relative;z-index:1;margin:0 auto;max-width:31ch;color:var(--muted);line-height:1.65}.links{position:relative;z-index:1;display:grid;gap:12px;margin-top:31px}.link{padding:18px;border:1px solid var(--line);background:var(--cream);transition:.25s}.link:hover{translate:0 -4px;background:#dce8e0}.link small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--muted)}.link span{font:600 27px var(--serif);color:var(--blue)}.hint{margin-top:26px;color:var(--green);font:600 23px var(--hand)}.lang-switch{position:absolute;z-index:2;top:21px;right:24px;display:flex;gap:7px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.1em}.lang-switch a{padding:2px 0;border-bottom:1px solid transparent}.lang-switch a[aria-current="page"]{color:var(--blue);border-color:var(--blue)}@media(max-width:460px){.card{padding-top:57px}.lang-switch{top:17px;right:18px}}
  </style>

<body><main class="card"><nav class="lang-switch" aria-label="Site language"><a href="../uk/contact.html" data-language="uk">UA</a><a href="../pl/contact.html" data-language="pl">PL</a><a href="../en/contact.html" data-language="en" aria-current="page">EN</a></nav><a class="back" href="index.html">← back to the site</a><div class="eyebrow" id="package">selected format</div><h1>let’s<br>talk.</h1><p>Tell Nastasia which format caught your eye and she’ll guide you through the shoot or social media work.</p><div class="links"><a class="link" href="https://t.me/nastaasiyaa" target="_blank" rel="noopener"><small>Telegram</small><span>@nastaasiyaa</span></a><a class="link" href="https://instagram.com/byrdinacontent" target="_blank" rel="noopener"><small>Instagram</small><span>@byrdinacontent</span></a><a class="link" href="mailto:nastyabyrdina04@gmail.com"><small>Email</small><span>nastyabyrdina04@gmail.com</span></a></div><div class="hint">you can simply say “hello”</div></main><script>const p=new URLSearchParams(location.search).get('package');if(p)document.querySelector('#package').textContent='format: '+p;document.querySelectorAll('[data-language]').forEach(link=>{link.href+=location.search+location.hash;link.addEventListener('click',()=>localStorage.setItem('byrdina-language',link.dataset.language))});</script></body>
